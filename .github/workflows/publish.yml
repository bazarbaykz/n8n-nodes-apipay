name: Publish to npm

on:
  push:
    tags:
      - '*.*.*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1. `lts/*` satisfies the
          # first but ships npm 10.x, so npm is upgraded below — without it the publish falls
          # back to looking for a token and fails with ENEEDAUTH.
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx n8n-node lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # No NODE_AUTH_TOKEN: the OIDC token from `id-token: write` is the credential, and npm
      # generates the provenance attestation itself when publishing this way.
      - name: Publish
        run: npm publish --access public
